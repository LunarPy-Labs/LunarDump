[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lunardump"
version = "0.1.0"
description = "A lightweight, zero-trust CLI tool built in Python to automate, encrypt, and stream database backups directly to multi-cloud storage."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Indhi Farhandika R" }
]
keywords = ["backup", "database", "postgres", "mysql", "mongodb", "encryption", "s3", "gcs", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Archiving :: Backup",
]
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "cryptography>=41.0.0",
    "boto3>=1.28.0",
    "httpx>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/indhifarhandika/LunarDump"
Repository = "https://github.com/indhifarhandika/LunarDump"
"Bug Tracker" = "https://github.com/indhifarhandika/LunarDump/issues"
Funding = "https://ko-fi.com/indhifarhandika"

[project.optional-dependencies]
gcs = [
    "google-cloud-storage>=2.10.0"
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.scripts]
lunardump = "lunardump.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
